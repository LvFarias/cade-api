version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cade_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: cade_db
    ports:
      - "5432:5432"
    volumes:
      - cade_pgdata:/var/lib/postgresql/data

volumes:
  cade_pgdata: